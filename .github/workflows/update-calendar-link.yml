name: Update calendar booking link

on:
  push:
    paths:
      - '.github/workflows/update-calendar-link.yml'

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace old Google Calendar booking link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          old = 'https://calendar.app.google/fM6s1QX8cBXkA5Wm9'
          new = 'https://calendar.app.google/WVzZTbtqrUtEFaL3A'
          if old not in text:
              raise SystemExit('Old calendar link not found; no change made.')
          p.write_text(text.replace(old, new))
          PY

      - name: Commit updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect website to Google Calendar booking page"
          git push
