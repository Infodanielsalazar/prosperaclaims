name: Update calendar booking link

on:
  push:
    paths:
      - '.github/workflows/update-calendar-link.yml'

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace Google Calendar booking link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text()
          new = 'https://calendar.app.google/Q8YByrSeFzoiBN286'
          updated, count = re.subn(r'https://calendar\.app\.google/[A-Za-z0-9]+', new, text)
          if count == 0:
              raise SystemExit('No Google Calendar booking link found; no change made.')
          p.write_text(updated)
          print(f'Updated {count} calendar link(s).')
          PY

      - name: Commit updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect website to new Google Calendar booking page"
          git push
