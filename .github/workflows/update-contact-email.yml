name: Update contact email

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-contact-email.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old contact email
        run: |
          sed -i 's/info\.danielsalazar@gmail\.com/dsalazar@prosperaclaims.com/g' index.html
          if grep -q 'info.danielsalazar@gmail.com' index.html; then
            echo 'Old email still present'
            exit 1
          fi
      - name: Commit website update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'Update Prospera Claims contact email'
            git push
          fi